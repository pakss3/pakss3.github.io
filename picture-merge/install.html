<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사진합치기 콜라주 PDF - 다운로드</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }

    .card {
      background: #1a1a24;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed, #0f766e);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 12px;
    }

    .btn:active { transform: scale(0.97); opacity: 0.85; }

    .btn-ios {
      background: #000;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .btn-android {
      background: #01875f;
    }

    .btn svg { flex-shrink: 0; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      color: rgba(255,255,255,0.2);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    .detected {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">🖼️</div>
  <h1>사진합치기 콜라주 PDF</h1>
  <p>사진을 합치고, 콜라주를 만들고,<br>PDF로 저장하세요.</p>

  <a class="btn btn-ios" href="https://apps.apple.com/kr/app/%EC%82%AC%EC%A7%84%ED%95%A9%EC%B9%98%EA%B8%B0-%EC%BD%9C%EB%9D%BC%EC%A3%BC-pdf/id6760090775" id="btn-ios">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
      <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
    </svg>
    App Store에서 다운로드
  </a>

  <div class="divider">또는</div>

  <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.pakss3.picturemerge" id="btn-android">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
      <path d="M3.18 23.76c.33.18.71.19 1.06.04l11.29-6.53-2.4-2.4-9.95 8.89zM.54 1.32C.2 1.64 0 2.17 0 2.87v18.26c0 .7.2 1.23.54 1.55l.08.07 10.22-10.22v-.24L.62 1.25l-.08.07zM20.07 10.33l-2.9-1.68-2.68 2.68 2.68 2.68 2.92-1.68c.83-.48.83-1.26-.02-2zM4.24.2L15.53 6.73l-2.4 2.4L3.18.24C3.53.09 3.91.1 4.24.2z"/>
    </svg>
    Google Play에서 다운로드
  </a>

  <p class="detected" id="detected-msg"></p>
</div>

<script>
  var ua = navigator.userAgent || navigator.vendor || window.opera;
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /android/i.test(ua);

  var iosUrl = 'https://apps.apple.com/kr/app/%EC%82%AC%EC%A7%84%ED%95%A9%EC%B9%98%EA%B8%B0-%EC%BD%9C%EB%9D%BC%EC%A3%BC-pdf/id6760090775';
  var androidUrl = 'https://play.google.com/store/apps/details?id=com.pakss3.picturemerge';

  var msg = document.getElementById('detected-msg');

  if (isIOS) {
    window.location.replace(iosUrl);
  } else if (isAndroid) {
    window.location.replace(androidUrl);
  }
</script>

</body>
</html>
