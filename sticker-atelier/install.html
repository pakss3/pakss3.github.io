<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스티커 아틀리에 — 설치하기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
    }
    .icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(135deg, #f5e6d3 0%, #e8d5c4 100%);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      color: #666;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin: 6px;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .btn-ios   { background: #000; }
    .btn-android { background: #01875f; }
    .store-links { margin-top: 8px; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirecting { font-size: 14px; color: #999; }
  </style>
  <script>
    var IOS_URL     = "https://apps.apple.com/us/app/%EC%8A%A4%ED%8B%B0%EC%BB%A4-%EC%95%84%ED%8B%80%EB%A6%AC%EC%97%90/id6765725143";
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.pakss3.sticker_pack_very_good_macker";

    function detect() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "ios";
      if (/android/i.test(ua)) return "android";
      return "other";
    }

    (function () {
      var platform = detect();
      if (platform === "ios") {
        window.location.replace(IOS_URL);
      } else if (platform === "android") {
        window.location.replace(ANDROID_URL);
      }
    })();
  </script>
</head>
<body>
  <div class="container" id="main">
    <div class="icon">🎨</div>
    <h1>스티커 아틀리에</h1>
    <p id="status-msg">스토어로 이동 중…</p>
    <div class="spinner" id="spinner"></div>
    <p class="redirecting" id="redirect-note">자동으로 이동하지 않으면 아래 링크를 눌러주세요.</p>

    <div class="store-links" id="store-links" style="display:none;">
      <a class="btn btn-ios" href="https://apps.apple.com/us/app/%EC%8A%A4%ED%8B%B0%EC%BB%A4-%EC%95%84%ED%8B%80%EB%A6%AC%EC%97%90/id6765725143">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        App Store
      </a>
      <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.pakss3.sticker_pack_very_good_macker">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M3.18 23.76c.35.2.74.24 1.12.12l.08-.05 10.4-6.01-2.26-2.27zm15.43-9.4L16.2 12.8l-2.45 2.44 2.46 2.46 2.4-1.38a1.36 1.36 0 000-2.36zM3.08.53a1.35 1.35 0 00-.22.77v21.4c0 .28.08.54.22.77l.06.06 11.99-12v-.06zm9.29 8.72L3.08.53l-.01.01 9.3 8.7z"/></svg>
        Google Play
      </a>
    </div>
  </div>

  <script>
    // Show fallback links after 1.5s in case redirect didn't fire (desktop etc.)
    setTimeout(function () {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("store-links").style.display = "block";
      var platform = detect();
      if (platform === "other") {
        document.getElementById("status-msg").textContent = "설치할 스토어를 선택해 주세요.";
      }
    }, 1500);
  </script>
</body>
</html>
